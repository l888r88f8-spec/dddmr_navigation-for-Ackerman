/**:
  ros__parameters:
    # 车体包络（碰撞检测），所有节点和 trajectory generator 复用这一份
    cuboid:
      flb: [0.50, 0.32, -0.32]                                  # front-left-bottom
      frb: [0.50, -0.32, -0.32]                                 # front-right-bottom
      flt: [0.50, 0.32, 0.55]                                   # front-left-top
      frt: [0.50, -0.32, 0.55]                                  # front-right-top
      blb: [-0.38, 0.32, -0.32]                                 # back-left-bottom
      brb: [-0.38, -0.32, -0.32]                                # back-right-bottom
      blt: [-0.38, 0.32, 0.55]                                  # back-left-top
      brt: [-0.38, -0.32, 0.55]                                 # back-right-top

p2p_move_base:
  ros__parameters:
    orchestrator_frequency: 15.0                                 # 任务编排循环频率，越高状态切换和控制消费越及时
    route_request_patience: 90.0                                 # 等待全局路径请求返回的最大时长（s）
    blocked_wait_patience: 2.0                                   # blocked wait 状态最长持续时间（s），先给局部障碍清除窗口
    collision_confirm_cycles: 5                                  # 连续碰撞确认周期，避免单帧点云误触发全局重规划
    blocked_confirm_time: 1.0                                    # 阻塞持续确认时间（s）
    min_replan_interval: 3.0                                     # 两次全局重规划之间的最小间隔（s）
    route_deviation_confirm_cycles: 10                           # 路径偏离连续确认周期
    route_deviation_confirm_time: 1.0                            # 路径偏离持续确认时间（s）
    runtime_budget_safety_stop_enabled: false                    # 初期只告警不因预算超限停车
    max_local_planning_time_ms: 50.0                             # Orin NX 局部规划预算（ms）
    max_end_to_end_local_cycle_ms: 80.0                          # Orin NX 单周期端到端预算（ms）
    budget_warn_after_consecutive_overruns: 2                    # 连续超预算告警阈值
    budget_stop_after_consecutive_overruns: 10                   # 连续超预算安全停车阈值
    local_obstacle_layer:
      enabled: true                                              # Phase 2.1 默认只预留，置 true 后订阅点云并发布诊断，不参与控制
      input_cloud_topic: "lio_sam/cloud_nonground"               # 建议使用去地点云；若不是 base_frame，节点会尝试 TF 转换
      base_frame: "base_link"                                    # 局部 ROI 和 footprint 查询坐标系
      status_topic: "local_obstacle_layer/status"                # std_msgs/String，发布 raw/filtered/stale/budget 状态
      debug_cloud_topic: "local_obstacle_layer/cloud"            # sensor_msgs/PointCloud2，发布过滤后的局部障碍点
      roi_forward: 6.0                                           # 前向 ROI（m）
      roi_backward: 1.0                                          # 后向 ROI（m）
      roi_left: 3.0                                              # 左侧 ROI（m）
      roi_right: 3.0                                             # 右侧 ROI（m）
      min_z: -0.15                                               # 障碍高度下限（m）
      max_z: 2.0                                                 # 障碍高度上限（m）
      voxel_leaf_size: 0.08                                      # 体素降采样分辨率（m），控制 Orin NX CPU/内存预算
      max_snapshot_points: 30000                                 # 单帧最多保留点数，超过会截断并标记 over_budget
      max_update_time_ms: 20.0                                   # 单次局部障碍层更新时间预算（ms）
      stale_timeout_sec: 0.6                                     # 点云时间戳过期阈值（s）
      publish_debug_cloud: false                                 # 初期建议 false，调参/RViz 验证时再开启
      footprint_front: 0.50                                      # 与 cuboid 保持一致
      footprint_back: 0.38
      footprint_left: 0.32
      footprint_right: 0.32
    control_failure_patience: 10.0                               # 控制连续失败容忍时间（s）
    max_recovery_attempts: 10                                    # 恢复行为最大尝试次数
    oscillation_distance: 0.5                                    # 位移超过该值视为脱离振荡（m），Ackermann 低速跟踪不宜过大
    oscillation_angle: 1.0                                       # 转角超过该值视为脱离振荡（rad）
    oscillation_patience: 15.0                                   # 振荡容忍时间，超时触发恢复/重规划（s）
    tracking_controller_name: "ackermann_simple"                 # 跟踪阶段控制器名
    alignment_controller_name: "ackermann_heading_rotate_shortest"  # 对齐阶段控制器名
    recovery_action_name: ""                                     # 恢复行为名，空字符串表示不显式指定

# 全局规划：路径请求与后端选择
global_plan_manager:
  ros__parameters:
    route_action_name: "get_plan"                                # 全局规划 action 名称
    route_request_frequency: -1.0                                # 路径请求采用事件触发；负值表示不周期轮询
    freeze_route_per_goal: false

global_planner:
  ros__parameters:
    # 全局规划器公共参数
    enable_detail_log: true                                      # 是否开启详细日志
    # use_pre_graph: true

    # 全局规划器后端选择
    raw_route_backend: "hybrid_a_star"                           # graph_a_star/hybrid_a_star

    # 全局规划器后端参数: graph_a_star
    graph_a_star:
      turning_weight: 0.5                                        # 转折惩罚，越大越偏向平滑
      a_star_expanding_radius: 0.5                               # 图搜索扩张半径（m）
      graph_path_smoothing:
        enable: false                                              # 是否开启 graph 路径后处理平滑
        iterations: 16                                            # 平滑迭代次数
        weight: 0.35                                              # 单次平滑强度
        max_shift: 0.25                                           # 单点相对原路径最大偏移（m）
        lock_start_distance: 1.2                                  # 起点锁定距离（m）
        lock_goal_distance: 1.2                                   # 终点锁定距离（m）
        ground_search_radius: 0.8                                 # 平滑候选点地面搜索半径（m）

    # 全局规划器后端参数: hybrid_a_star
    hybrid_astar:
      wheelbase: 0.46                                             # 轴距（m）
      max_steer: 0.238                                            # 最大转角（rad）
      steer_sample_count: 5                                       # 转角采样数
      heading_bin_count: 32                                       # 航向离散 bin 数
      primitive_length: 0.8                                       # 运动原语长度（m）
      primitive_step: 0.15                                        # 原语离散步长（m）
      projection_search_radius: 0.6                               # 起终点投影搜索半径（m）
      goal_position_tolerance: 0.3                                # 终点位置容差（m）
      goal_heading_tolerance: 0.8                                 # 终点航向容差（rad），让全局路径约束目标朝向
      obstacle_penalty_weight: 1.0                                # 障碍代价权重
      edge_weight_penalty_weight: 6.0                             # 地面边缘权重惩罚
      edge_weight_safe_threshold: 1.2                             # 边缘权重安全阈值
      edge_weight_soft_cap: 12.0                                  # 边缘权重软上限
      edge_weight_hard_reject_threshold: 0.0                      # 边缘权重硬拒绝阈值（0表示关闭）
      heuristic_heading_weight: 0.35                              # 启发式中航向项权重
      max_projected_pitch: 0.55                                   # 投影点最大坡度（rad）
      max_projected_vertical_jump: 0.12                           # 投影点最大垂向跳变（m）
      allow_sample_nearest_fallback: false                        # 采样投影失败时是否允许最近邻回退

# 全局规划感知输入
perception_3d_global:
  ros__parameters:
    enable_detail_log: false                                     # 是否开启感知层详细日志
    global_frame: "map"                                          # 全局坐标系
    robot_base_frame: "base_link"                                # 机器人基坐标系
    max_obstacle_distance: 9999.0                                # 障碍最大采样距离（m）
    inscribed_radius: 0.52                                       # 小车最小外接圆半径
    inflation_descending_rate: 2.0                               # 膨胀衰减率
    inflation_radius: 0.9                                        # 全局障碍膨胀半径（m）
    sensors_collected_frequency: 15.0                            # 传感器融合频率（Hz）
    plugins: ["map", "lidar"]                                    # 全局层插件列表，动态障碍参与重规划
    dgraph_publish_frequency: 1.0                                # 图结构发布频率（Hz）

    map:
      plugin: "perception_3d::StaticLayer"                       # 静态地图层插件
      is_local_planner: false                                    # 该层用于全局规划
      use_adaptive_connection: false                             # 稀疏区域是否自适应增大连边半径
      adaptive_connection_number: 20                             # 自适应连边目标邻居数
      radius_of_ground_connection: 1.5                           # 固定连边半径（use_adaptive_connection=false 时生效）
      intensity_search_radius: 1.0                               # 强度搜索半径（过大易误判窄通道）
      intensity_search_punish_weight: 0.3                        # 孤立点惩罚权重
      static_imposing_radius: 1.5                                # 静态图施加权重半径（m）
      map_topic: "mapcloud"                                      # 全局地图点云 topic
      ground_topic: "mapground"                                  # 全局地面点云 topic

      support:
        mapping_mode: false                                      # 建图模式；开启后通常会关闭边缘检测
        enable_edge_detection: true                              # 是否启用边缘检测
        generate_static_graph: false                              # 是否生成静态图缓存
        merge_ground_layers: true                                # 是否合并多层地面点
        merge_ground_xy_resolution: 0.3                          # 合并地面 XY 分辨率（m）
        merge_ground_z_tolerance: 0.2                            # 合并地面 Z 容差（m）

    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"           # 多线雷达插件
      is_local_planner: false                                    # 该雷达层用于全局规划
      topic: "lio_sam/cloud_nonground"                           # 输入去地点云 topic
      pub_gbl_marking_for_visualization: true                    # 是否发布全局标记点用于可视化
      vertical_FOV_top: 15.0                                     # 垂直视场上限（deg）
      vertical_FOV_bottom: -15.0                                 # 垂直视场下限（deg）
      scan_effective_positive_start: 0.0                         # 正向扫描有效起始角（deg）
      scan_effective_positive_end: 180.0                         # 正向扫描有效终止角（deg）
      scan_effective_negative_start: -0.0                        # 反向扫描有效起始角（deg）
      scan_effective_negative_end: -180.0                        # 反向扫描有效终止角（deg）
      euclidean_cluster_extraction_tolerance: 0.1                # 欧式聚类距离阈值（m）
      euclidean_cluster_extraction_min_cluster_size: 1           # 欧式聚类最小点数
      xy_resolution: 0.05                                        # 栅格 XY 分辨率（m）
      height_resolution: 0.05                                    # 高度分辨率（m）
      min_obstacle_height: -0.12
      marking_height: 2.0                                        # 标记障碍物高度上限（m）
      perception_window_size: 5.0                                # 全局感知窗口（m）
      segmentation_ignore_ratio: 1.1                             # 与静态图匹配比例阈值（高于该值忽略）
      expected_sensor_time: 0.5                                  # 传感器时间容忍（s），避免调度抖动导致全局动态层过期

# 局部规划：控制后端选择与公共约束
local_planner:
  ros__parameters:
    # 局部规划器公共参数
    odom_topic: /lio_sam/localization/odometry                   # 局部规划里程计输入
    controller_frequency: 15.0                                   # 控制循环频率（Hz）

    # 局部规划器后端选择
    controller_backend: "mppi"                 # 控制后端 legacy_rollout / regulated_pure_pursuit / mppi

    # 局部规划器公共路径/目标参数
    local_reference:
      forward_distance: 4.0                                     # 前向参考窗口长度（m），决定 blocked_wait 的前向检测距离
      backward_distance: 1.0                                    # 后向保留窗口长度（m）

    # 剪裁锚点
    causal_prune_search_window: 40                              # 仅在当前进度附近搜索，防止跳段
    causal_prune_max_index_jump: 15                             # 单周期最大索引跳步
    causal_prune_max_arc_jump: 2.0                              # 单周期最大弧长跳步（m）
    causal_prune_max_lateral_distance: 2.0                      # 机器人到候选段最大横向距离（m）
    causal_prune_max_heading_error: 1.75                        # 候选切线与车头最大夹角（rad）
    max_prune_failure_cycles: 3                                 # 连续 prune 失败阈值
    allow_offroute_anchor_recovery: true                        # 偏离后允许在前向窗口恢复锚点
    cached_pruned_path_timeout_sec: 0.8                         # 复用缓存局部路径的最长时长（s）
    prune_plane_timeout: 3.0                                    # 局部裁剪路径失效超时（s）

    # 到点判定
    xy_goal_tolerance: 0.3                                      # 位置容差（m）
    yaw_goal_tolerance: 0.8                                     # 航向容差（rad），与全局终点朝向约束保持一致

    # 局部控制后端参数: regulated_pure_pursuit
    regulated_pure_pursuit:
      critic_trajectory_generator_name: "ackermann_simple"       # RPP 名义轨迹送入哪套 critics 评估
      nominal_linear_speed: 0.3                                 # 常规巡航速度（m/s）
      min_linear_speed: 0.05                                    # 最小跟踪速度（m/s）
      alignment_linear_speed: 0.08                              # 对齐阶段速度（m/s）
      goal_slowdown_distance: 2.5                               # 终点减速起始距离（m）
      use_velocity_scaled_lookahead_dist: false                 # false 时使用固定前视距离，不按速度缩放
      lookahead_dist: 1.0                                       # 固定前视距离（m）
      alignment_lookahead_distance: 1.0                         # 对齐模式前视距离（m）
      max_lateral_accel: 1.5                                    # 曲率调速横向加速度上限（m/s^2）
      prediction_horizon_sec: 6.0                               # 单候选轨迹预测时长（s）
      prediction_step_sec: 0.1                                  # 预测离散步长（s）
      wheelbase: 0.46                                           # Ackermann 轴距（m）
      max_steer: 0.238                                          # 最大转角（rad）等效自行车模型前轮转角，atan(wheelbase / min_turning_radius)
      max_angular_velocity: 0.158                               # 输出角速度上限（rad/s），linear_speed / min_turning_radius

    # 局部控制后端参数: mppi
    mppi:
      prediction_horizon_sec: 5.0                               # MPPI 预测时域（s），Ackermann 绕障需要足够横向位移
      model_dt: 0.0666667                                       # 与 15Hz controller_period 对齐以启用控制序列 shift
      batch_size: 96                                            # 采样批量；点云 KDTree 查询较重，优先保证实时预算
      structured_candidate_count: 8                             # 成对连续圆弧/S弯候选，保证小批量中存在完整绕障控制形状
      structured_min_vx: 0.20                                  # 结构化绕障模板最低目标速度，静止启动时仍可产生可分类的横向位移
      departure_lateral_offset: 0.42                            # 绕障侧向脱离阈值（m）= 半车宽 0.32 + 碰撞裕度 0.10；越过后允许回舵
      iteration_count: 1                                        # 与 Nav2 默认一致，通常 1 次迭代即可
      temperature: 0.1                                          # MPPI softmax 温度；降低后更跟随低代价绕障样本，减少左右平均抵消
      gamma: 0.015                                              # 控制能量项权重
      vx_std: 0.2                                               # 线速度高斯噪声标准差
      wz_std: 0.08                                              # Ackermann 可行域内角速度噪声，避免大量样本裁成正负满舵
      vx_min: 0.05                                              # Ackermann 平台默认只前进
      vx_max: 0.5                                               # 最大前进速度；过低会同步压低 Ackermann 可用角速度
      wz_max: 0.526                                             # 角速度硬上限，最终还会被 steering 几何约束裁剪
      ax_min: -3.0                                              # 最大减速度
      ax_max: 3.0                                               # 最大加速度，避免启动时速度被钳在 vx_min
      az_max: 3.5                                               # 最大角加速度，保持初始转向采样有足够响应
      wheelbase: 0.46                                           # 轴距
      max_steer: 0.238                                          # 最大前轮转角（rad）
      seed: 7                                                   # 固定 seed，保证离线测试可复现
      regenerate_noises: false                                  # 与 Nav2 默认一致，跨周期复用噪声以稳定绕障方向
      use_perception_blocked_preemption: false                  # MPPI 避障时不让路径阻塞意见提前触发重规划，由 critic 体系判断是否可绕行
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]  # 官方 MPPI critic 顺序

      ConstraintCritic:
        cost_weight: 4.0                                        # 运动约束惩罚权重
        cost_power: 1                                           # 代价幂次

      ObstaclesCritic:
        cost_power: 1                                           # 障碍代价幂次
        critical_weight: 20.0                                   # 近碰撞/碰撞惩罚权重
        repulsion_weight: 1.5                                   # 远离障碍偏好权重
        collision_cost: 100000.0                                # 轨迹碰撞代价
        collision_margin_distance: 0.10                         # 近碰撞边界（m）
        near_goal_distance: 0.5                                 # 近目标时降低远离障碍偏好
        inflation_radius: 2.2                                   # 点云障碍排斥半径（m），略大于约 1.9m 最小转弯半径以提前选边
        trajectory_point_step: 4                                # 障碍检测步长，降低每周期 KDTree 查询量

      GoalCritic:
        cost_weight: 5.0                                        # 近目标位置收敛权重
        cost_power: 1
        threshold_to_consider: 1.4                              # 路径剩余长度小于该值时启用

      GoalAngleCritic:
        cost_weight: 3.0                                        # 近目标朝向收敛权重
        cost_power: 1
        threshold_to_consider: 0.5
        symmetric_yaw_tolerance: false

      PathAlignCritic:
        cost_weight: 10.0                                       # 轨迹贴合路径权重
        cost_power: 1
        threshold_to_consider: 0.5
        max_path_occupancy_ratio: 0.07
        offset_from_furthest: 20
        trajectory_point_step: 4
        use_path_orientations: false

      PathFollowCritic:
        cost_weight: 5.0                                        # 终端点向前跟随路径权重
        cost_power: 1
        threshold_to_consider: 1.4
        offset_from_furthest: 6

      PathAngleCritic:
        cost_weight: 2.2                                        # 终端航向对准路径权重
        cost_power: 1
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
        offset_from_furthest: 4
        mode: 0                                                 # 0: forward preference

      PreferForwardCritic:
        cost_weight: 5.0                                        # 倒车惩罚权重
        cost_power: 1
        threshold_to_consider: 0.5

    # 调试可视化
    debug_publish:
      robot_cuboid: true                                        # 发布车体包络
      aggregated_pc: true                                       # 发布聚合障碍点云
      prune_plan: false                                         # 发布裁剪后的局部路径
      accepted_trajectory: false                                # 发布所有可用候选轨迹
      best_trajectory: true                                     # 发布最优轨迹
      all_trajectories: false                                   # 发布全部采样轨迹（较重）

# 局部控制后端参数: legacy_rollout trajectory_generators
trajectory_generators:
  ros__parameters:
    plugins: ["ackermann_simple"] # , "ackermann_heading_rotate_inplace", "ackermann_heading_rotate_shortest"]  # 轨迹生成插件列表

    ackermann_heading_rotate_shortest:
      plugin: "trajectory_generators::DDRotateInplaceTheory"    # 最短角对齐旋转
      controller_frequency: 10.0                                # 旋转控制频率（Hz）
      rotation_speed: 0.5                                       # 旋转角速度（rad/s）

    ackermann_heading_rotate_inplace:
      plugin: "trajectory_generators::DDRotateInplaceTheory"    # 原地旋转（恢复行为）
      controller_frequency: 10.0                                # 旋转控制频率（Hz）
      rotation_speed: 0.5                                       # 旋转角速度（rad/s）

    ackermann_simple:
      plugin: "trajectory_generators::AckermannSimpleTrajectoryGeneratorTheory"  # Ackermann 常规 rollout
      max_vel_x: 1.0                                             # 最大前进速度（m/s）
      min_vel_x: 0.05                                            # 最小前进采样速度（m/s）
      max_vel_theta: 0.526                                       # 角速度上限（rad/s）
      min_vel_theta: -0.526                                      # 角速度下限（rad/s）
      acc_lim_x: 6.0                                             # 线速度加速度限制（m/s^2）
      acc_lim_theta: 20.0                                        # 角速度加速度限制（rad/s^2）
      deceleration_ratio: 2.0                                    # 减速窗口比例
      max_motor_shaft_rpm: 3000.0                                # 电机轴最大转速（rpm）
      wheel_diameter: 0.16                                       # 轮径（m）
      gear_ratio: 1.0                                            # 减速比
      robot_radius: 0.25                                         # 机器人近似半径（m）
      wheelbase: 0.46                                            # 轴距（m）
      max_steer: 0.238                                           # 最大转角（rad）
      controller_frequency: 15.0                                 # 采样控制频率（Hz）
      sim_time: 1.5                                              # 单轨迹前向仿真时长（s）
      min_sim_distance: 2.0                                      # 低速候选也至少检查该前向距离，避免只减速不绕障
      linear_x_sample: 5.0                                       # 线速度采样数
      angular_z_sample: 10.0                                     # 角速度采样数
      sim_granularity: 0.05                                      # 位移离散步长（m）
      angular_sim_granularity: 0.025                             # 角位移离散步长（rad）

# 局部规划感知输入
perception_3d_local:
  ros__parameters:
    enable_detail_log: false                                     # 是否开启感知层详细日志
    global_frame: "map"                                          # 全局坐标系
    robot_base_frame: "base_link"                                # 机器人基坐标系
    max_obstacle_distance: 9999.0                                # 障碍最大采样距离（m）
    inscribed_radius: 0.52                                       # 车体内切安全半径（m）
    inflation_descending_rate: 2.0                               # 膨胀衰减率
    inflation_radius: 0.9                                        # 局部障碍膨胀半径（m）
    sensors_collected_frequency: 10.0                            # 局部感知融合频率（Hz）
    plugins: ["map", "lidar"]                                    # 局部层插件列表

    map:
      plugin: "perception_3d::StaticLayer"                       # 静态地图层
      is_local_planner: true                                     # 该层用于局部规划
      mapping_mode: false                                        # 建图模式
      map_topic: "mapcloud"                                      # 地图点云 topic
      ground_topic: "mapground"                                  # 地面点云 topic

    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"           # 多线雷达插件
      is_local_planner: true                                     # 该雷达层用于局部规划
      topic: "lio_sam/cloud_nonground"                           # 局部避障输入去地点云
      pub_gbl_marking_for_visualization: false                   # 是否发布可视化标记点
      vertical_FOV_top: 15.0                                     # 垂直视场上限（deg）
      vertical_FOV_bottom: -15.0                                 # 垂直视场下限（deg）
      scan_effective_positive_start: 0.0                        # 正向扫描有效起始角（deg）
      scan_effective_positive_end: 180.0                         # 正向扫描有效终止角（deg）
      scan_effective_negative_start: -0.0                        # 反向扫描有效起始角（deg）
      scan_effective_negative_end: -180.0                          # 反向扫描有效终止角（deg）
      xy_resolution: 0.05                                        # 栅格 XY 分辨率（m）
      height_resolution: 0.05                                    # 高度分辨率（m）
      min_obstacle_height: -0.12                                 # 障碍最低高度阈值（m）
      marking_height: 2.0                                        # 标记障碍高度上限（m）
      perception_window_size: 5.0                                # 局部障碍感知窗口（m）
      segmentation_ignore_ratio: 0.5                             # 与静态图匹配比例阈值（高于该值忽略）
      expected_sensor_time: 0.5                                  # 传感器时间容忍（s），避免偶发点云/调度延迟导致感知误判失效

# 恢复行为
recovery_behaviors:
  ros__parameters:
    plugins: ["rotate_inplace"]                                  # 恢复行为插件列表
    rotate_inplace:
      plugin: "recovery_behaviors::RotateInPlaceBehavior"        # 原地旋转恢复
      frequency: 15.0                                            # 恢复行为频率（Hz）
      tolerance: 0.3                                             # 旋转误差容差（rad）
      trajectory_generator_name: "ackermann_heading_rotate_inplace"  # 旋转行为使用的轨迹生成器

# 局部轨迹评分 critics
mpc_critics:
  ros__parameters:
    plugins: ["collision", "prefer_forward_speed", "stick_path", "pure_pursuit", "toward_global_plan", "collision_rotate", "collision_rotate_shortest", "prefer_rotate_shortest"]  # legacy/RPP 代价模型插件列表

    collision:
      plugin: "mpc_critics::CollisionModel"                      # trajectory generator 碰撞模型
      trajectory_generator: ackermann_simple
      weight: 1.0                                                # 碰撞代价总权重
      search_radius: 3.0                                         # 每个轨迹点的障碍搜索半径（m）
      clearance_penalty_distance: 1.5                            # 开始绕障距离（m）
      clearance_weight: 1.5                                      # 近障碍惩罚强度

    prefer_forward_speed:
      plugin: "mpc_critics::PreferForwardSpeedModel"             # 前向速度偏好模型
      trajectory_generator: ackermann_simple
      weight: 1.0                                                # 速度偏好权重
      target_speed: 0.3                                          # 巡航偏好目标速度（m/s）
      goal_slowdown_distance: 2.5                                # 靠近终点减速起始距离（m）
      goal_slowdown_min_speed: 0.0                               # 终点附近最低目标速度（m/s）

    stick_path:
      plugin: "mpc_critics::StickPathModel"                      # 贴线模型
      trajectory_generator: ackermann_simple
      weight: 0.05                                               # 贴线权重

    pure_pursuit:
      plugin: "mpc_critics::PurePursuitModel"                    # 追踪终点误差模型
      trajectory_generator: ackermann_simple
      weight: 0.35                                               # 总权重
      translation_weight: 0.0                                    # 位置误差权重
      orientation_weight: 0.0                                    # 朝向误差权重

    toward_global_plan:
      plugin: "mpc_critics::TowardGlobalPlanModel"               # 贴近全局路径模型
      trajectory_generator: ackermann_simple
      weight: 0.5                                                # 贴近全局路径权重

    collision_rotate:
      plugin: "mpc_critics::CollisionModel"                      # 旋转碰撞模型（inplace）
      trajectory_generator: ackermann_heading_rotate_inplace     # 作用轨迹生成器
      weight: 1.0                                                # 权重

    collision_rotate_shortest:
      plugin: "mpc_critics::CollisionModel"                      # 旋转碰撞模型（shortest）
      trajectory_generator: ackermann_heading_rotate_shortest    # 作用轨迹生成器
      weight: 1.0                                                # 权重

    prefer_rotate_shortest:
      plugin: "mpc_critics::ShortestAngleModel"                  # 最短角优先模型
      trajectory_generator: ackermann_heading_rotate_shortest    # 作用轨迹生成器
      weight: 1.0                                                # 权重
