# Opt-in local-map / MPPI environment + hardware overlay.
#
# This file is the *second* ROS parameter file for every navigation node in
# p2p_move_base_local_map.launch.py:
#   [baseline p2p_move_base_localization.yaml, this overlay, final overrides]
# Later files win. Keep the authoritative current Hunter SE driver geometry
# (0.550 m wheelbase, 0.520 m track) explicit here and in the baseline so both
# launch paths use the same vehicle geometry.  The old 0.460/0.550 manual
# values are superseded by the 2026-11-05 user directive.
#
# The local_map.* block is read by local_planner only when:
#   local_planner.controller_backend == "mppi"
#   local_planner.mppi.environment_backend == "local_map"
#
# Geometry below records the user-confirmed measurements and current driver
# wheelbase/track. body_max is omitted
# on purpose until the highest rigid attachment height is measured, so the
# local-map backend reports control-not-ready. The standalone shadow node can
# still map with its geometry-unset diagnostic configuration.
# Legacy backends do not read these keys and are unaffected.

global_planner:
  ros__parameters:
    # Exact baseline hierarchy: global_planner.hybrid_astar.
    hybrid_astar:
      wheelbase: 0.550    # HunterSEParams driver wheelbase, matching baseline
      max_steer: 0.3270520925102273    # HunterSEParams virtual central angle (22 deg inner, 0.550/0.520)

local_planner:
  ros__parameters:
    mppi:
      # Exact accepted values: legacy_points | local_map.
      environment_backend: "local_map"
      wheelbase: 0.550    # HunterSEParams driver wheelbase, matching baseline
      max_steer: 0.3270520925102273    # HunterSEParams virtual central angle (22 deg inner, 0.550/0.520)

      # Autoware-style geometric bypass side selection. The blocking obstacle's
      # lateral offset fixes the passing side (opposite the obstacle); the side
      # is only used when it is decisive and at least
      # robot_half_width + collision_margin + bypass_width_margin wide.
      # Provenance: preferred_side_min_offset equals one lateral probe step
      # (0.15 m), the smallest non-zero offset the scan can register because
      # probes closer than half a step (0.075 m) are skipped. A single blocked
      # probe on one side is therefore already decisive.
      avoidance_geometry_enabled: true
      preferred_side_min_offset: 0.15   # m; below this the obstacle is "centred"
      bypass_width_margin: 0.10         # m; extra floor on top of half width + margin
      # Cost per metre of lateral travel needed to reach the usable bypass band
      # on a side. Applied only while the blocking geometry does not force a
      # side, so a marginal cost saving cannot pull the vehicle across the
      # route. 0 restores pure cost comparison.
      bypass_detour_weight: 1.0
      lateral_probe_max_offset: 1.5     # m; lateral scan half-band around the route
      lateral_probe_step: 0.15          # m; width resolution of the occupancy scan

      # Diagnostic-only blocked-corridor trace (no control decision reads it).
      # Prints at the given period while the route has >=3 blocked points, and
      # immediately whenever side / avoidance stage / feasibility changes. The
      # corridor bitmap uses the same robot cuboid as the trajectory checks:
      # F free, B blocked, ? not evaluated; L/R order is 0.15..1.5 m from the
      # route centreline. Set false to silence it without rebuilding.
      debug_blocked_diagnostics: true
      debug_blocked_diagnostics_period: 0.1   # s; 0 logs every control cycle

    # Exact baseline hierarchy: local_planner.regulated_pure_pursuit.
    regulated_pure_pursuit:
      wheelbase: 0.550    # HunterSEParams driver wheelbase, matching baseline
      max_steer: 0.3270520925102273    # HunterSEParams virtual central angle (22 deg inner, 0.550/0.520)

trajectory_generators:
  ros__parameters:
    # Exact baseline hierarchy: trajectory_generators.ackermann_simple.
    ackermann_simple:
      wheelbase: 0.550    # HunterSEParams driver wheelbase, matching baseline
      max_steer: 0.3270520925102273    # HunterSEParams virtual central angle (22 deg inner, 0.550/0.520)

/**:
  ros__parameters:
    local_map:
      cloud_topic: "/lio_sam/deskew/cloud_deskewed"

      frames:
        map: "odom"
        base: "base_link"
        sensor: "hesai_lidar"

      # 12.8 x 12.8 x 4.0 m at 0.1 m. size_* must be an integer multiple of
      # voxel_size. The core clips rays to this full 3-D window (ground
      # included); out-of-window endpoints can still clear crossing rays.
      map:
        voxel_size: 0.1
        size_x: 12.8
        size_y: 12.8
        size_z: 4.0
        max_range: 8.0
        max_voxels: 4000000
        inflation_radius: 0.0
        hit_log_odds: 0.85
        miss_log_odds: -0.85
        occupied_threshold: 0.4
        free_threshold: -0.4
        min_log_odds: -3.0
        max_log_odds: 3.0

      terrain:
        contact_patch_radius: 0.18
        max_contact_search_z: 0.35
        max_drop: 0.30
        max_step: 0.12
        max_slope_rad: 0.40
        max_cross_slope_rad: 0.30
        max_warp: 0.05
        min_patch_coverage: 0.60
        min_plane_confidence: 0.10
        max_snapshot_age: 0.50
        cluster_max_dz: 0.22
        plane_inlier_tol: 0.06
        max_patches: 20000
        unknown_body_policy: "reject"

      # User-confirmed vehicle geometry in base_link (x forward, y left).
      # Wheel contacts are front-left, front-right, rear-left, rear-right.
      # body_min.x/y are symmetric-body approximations only, NOT measured
      # overhangs: approximate +/-0.410 and +/-0.320, to be physically checked.
      # body_min.z = ground_clearance - base_contact_height = .120 - .220.
      #
      # body_max is intentionally OMITTED until the highest rigid attachment
      # (LiDAR/mount) ground height is measured. Do not use chassis height .310
      # or its .310 - .220 = .090 relative top as the full-vehicle envelope.
      # When measured, expected body_max.x/y are the same approximate
      # +/-0.410 / +/-0.320, and body_max.z = highest_attachment_ground_height
      # - .220. Until then the backend must stay control-not-ready.
      geometry:
        # base_link stays between the axles: x=+/-wheelbase/2=+/-0.275,
        # y=+/-track/2=+/-0.260, preserving the 0.220 m contact/base height.
        wheel_contacts: [0.275, 0.260, -0.220,
                         0.275, -0.260, -0.220,
                        -0.275, 0.260, -0.220,
                        -0.275, -0.260, -0.220]
        body_min: [-0.410, -0.320, -0.100]
        base_contact_height: 0.220
        body_clearance: 0.120

      # Self filtering is derived only from the validated rigid-body AABB, so
      # it stays disabled while body_max is unset.
      self_filter:
        enabled: true

      tf_timeout_sec: 0.10
      max_stamp_age_sec: 0.50
      future_tolerance_sec: 0.05
      clock_rewind_tolerance_sec: 0.10
      use_steady_receipt_age: true

      log_status: true
      status_log_period_sec: 2.00
